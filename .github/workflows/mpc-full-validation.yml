name: MPC full validation and real corpus
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpc-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify private validation packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Prepare
      - name: Full Release build and regression including Host
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Regression
      - name: Targeted rational surface GREEN
        run: |
          dotnet test tests/MPC.Application.Tests/MPC.Application.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RationalSurfaceApplicationTests
          if ($LASTEXITCODE -ne 0) { throw "B16 targeted GREEN failed." }
      - name: Verify all 276 real rational surface mappings
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $source = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -Filter "P01-R03-CurvedSurfaces.STEP")
          if ($source.Count -ne 1) { throw "Expected one R03 input." }
          dotnet run --project tools/ci/B16SurfaceProbe/B16SurfaceProbe.csproj -c Release -- $source[0].FullName (Join-Path $root "evidence/b16-surfaces.json")
          if ($LASTEXITCODE -ne 0) { throw "B16 source surface verification failed." }
      - name: R01 R02 R03 compatibility
        id: corpus
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Corpus
      - name: Reconcile current R03 diagnostics
        if: always() && steps.corpus.outcome == 'failure'
        run: python tools/ci/reconcile_r03.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpc-full-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/mpc-full-validation/evidence/
          retention-days: 30
          if-no-files-found: error
