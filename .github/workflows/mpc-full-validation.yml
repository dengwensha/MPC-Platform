name: MPC full validation and real corpus
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mpc-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Verify private validation packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Prepare
      - name: Full Release build and regression including Host
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Regression
      - name: Standalone source-face Worker acceptance without SOLIDWORKS
        run: ./tools/acceptance/Invoke-RegionSourceAcceptance.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP "mpc-full-validation/evidence/source-face-acceptance")
      - name: Record bounded R-U public-path compatibility
        run: |
          dotnet build tools/ci/RUCompatibilityProbe/RUCompatibilityProbe.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw "R-U compatibility probe build failed." }
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $inputs = Join-Path $root "ru-public-inputs"
          New-Item -ItemType Directory -Force $inputs | Out-Null
          Copy-Item tests/MPC.Tests/TestData/Step/Golden/*.step $inputs
          Copy-Item tests/MPC.Application.Tests/TestData/Step/RU-QuarterCone.step $inputs
          foreach ($name in @("P01-R01-Prismatic.STEP", "P01-R02-InternalBoundaries.STEP", "P01-R03-CurvedSurfaces.STEP")) {
            $files = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -File -Filter $name)
            if ($files.Count -ne 1) { throw "Expected one reference input: $name" }
            Copy-Item $files[0].FullName $inputs
          }
          dotnet tools/ci/RUCompatibilityProbe/bin/Release/net8.0/RUCompatibilityProbe.dll src/MPC.Application/bin/Release/net8.0 $inputs (Join-Path $root "evidence/ru-compatibility")
          if ($LASTEXITCODE -ne 0) { throw "R-U compatibility measurement failed." }
      - name: M2 manifest draft structural discovery (not eligibility)
        run: |
          dotnet build tools/ci/M2ScopeDraft/M2ScopeDraft.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw "M2 neutral extractor build failed." }
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $manifest = "docs/reviews/Tooling/evidence/M2-Manifest-v1-T3/Manifest-v1-DRAFT.json"
          dotnet tools/ci/M2ScopeDraft/bin/Release/net8.0/M2ScopeDraft.dll (Join-Path $root "ru-public-inputs") (Join-Path $root "m2-neutral")
          if ($LASTEXITCODE -ne 0) { throw "M2 public extraction failed." }
          python tools/ci/M2ScopeDraft/scope_draft.py $manifest (Join-Path $root "m2-neutral") (Join-Path $root "evidence/m2-manifest-draft")
          if ($LASTEXITCODE -ne 0) { throw "M2 draft classification failed." }
          python tools/ci/M2ScopeDraft/make_controls.py . (Join-Path $root "m2-scope-controls")
          if ($LASTEXITCODE -ne 0) { throw "M2 controls generation failed." }
          dotnet tools/ci/M2ScopeDraft/bin/Release/net8.0/M2ScopeDraft.dll (Join-Path $root "m2-scope-controls") (Join-Path $root "m2-control-neutral")
          if ($LASTEXITCODE -ne 0) { throw "M2 controls extraction failed." }
          python tools/ci/M2ScopeDraft/test_scope_draft.py $manifest (Join-Path $root "m2-control-neutral") (Join-Path $root "evidence/m2-scope-controls.json")
          if ($LASTEXITCODE -ne 0) { throw "M2 structural discovery controls failed." }
      - name: Targeted rational curve GREEN
        run: |
          dotnet test tests/MPC.Application.Tests/MPC.Application.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~RationalBSplineCurveApplicationTests
          if ($LASTEXITCODE -ne 0) { throw "B18 targeted GREEN failed." }
      - name: PT-04B real R01 and R02 oriented edge and dihedral evidence
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $cases = @(
            @{Name="P01-R01-Prismatic.STEP"; Hash="E518DB3332DC665B16CC31DA960C46B75B8D75128234129922A25146BE1C33AD"; Id="R01"},
            @{Name="P01-R02-InternalBoundaries.STEP"; Hash="0E9E2D6E15E1328C068E30703AD621AE883B6FE94A5DB51353A0D26F82E1578F"; Id="R02"}
          )
          foreach ($part in $cases) {
            $files = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -File -Filter $part.Name)
            if ($files.Count -ne 1) { throw "Expected one source for $($part.Id)" }
            dotnet run --project tools/ci/PT04BProbe/PT04BProbe.csproj -c Release -- $files[0].FullName $part.Hash (Join-Path $root "evidence/PT04B-$($part.Id).json")
            if ($LASTEXITCODE -ne 0) { throw "PT-04B $($part.Id) evidence failed." }
          }
      - name: Measure raw inventory diagnostics on R01 R02 R03
        run: |
          dotnet build tools/ci/M2InventoryProbe/M2InventoryProbe.csproj -c Release --warnaserror
          if ($LASTEXITCODE -ne 0) { throw "M2 inventory probe build failed." }
          python tools/ci/check_m2_inventory_probe.py tools/ci/M2InventoryProbe/bin/Release/net8.0/M2InventoryProbe.dll
          if ($LASTEXITCODE -ne 0) { throw "M2 inventory measurement controls failed." }
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $parts = @(
            @{Id="R01"; Name="P01-R01-Prismatic.STEP"; Hash="E518DB3332DC665B16CC31DA960C46B75B8D75128234129922A25146BE1C33AD"},
            @{Id="R02"; Name="P01-R02-InternalBoundaries.STEP"; Hash="0E9E2D6E15E1328C068E30703AD621AE883B6FE94A5DB51353A0D26F82E1578F"},
            @{Id="R03"; Name="P01-R03-CurvedSurfaces.STEP"; Hash="319DD894747CAF95AC1100C6283B55C014D40AEAC4ECCC00EF54648ADF9AEA12"}
          )
          foreach ($part in $parts) {
            $files = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -File -Filter $part.Name)
            if ($files.Count -ne 1) { throw "Expected one M2 source for $($part.Id)." }
            dotnet tools/ci/M2InventoryProbe/bin/Release/net8.0/M2InventoryProbe.dll $files[0].FullName $part.Hash $env:GITHUB_SHA (Join-Path $root "evidence/M2-inventory-$($part.Id).json")
            if ($LASTEXITCODE -ne 0) { throw "M2 inventory observation unavailable: $($part.Id)." }
          }
      - name: Verify all 276 real rational surface mappings
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $source = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -Filter "P01-R03-CurvedSurfaces.STEP")
          if ($source.Count -ne 1) { throw "Expected one R03 input." }
          dotnet run --project tools/ci/B16SurfaceProbe/B16SurfaceProbe.csproj -c Release -- $source[0].FullName (Join-Path $root "evidence/b16-surfaces.json")
          if ($LASTEXITCODE -ne 0) { throw "B16 source surface verification failed." }
      - name: Verify all 1910 real standard curves and edges
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $source = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -Filter "P01-R03-CurvedSurfaces.STEP")
          if ($source.Count -ne 1) { throw "Expected one R03 input." }
          dotnet run --project tools/ci/B17CurveProbe/B17CurveProbe.csproj -c Release -- $source[0].FullName (Join-Path $root "evidence/b17-curves.json")
          if ($LASTEXITCODE -ne 0) { throw "B17 real curve verification failed." }
      - name: Verify all four real rational curves and edges
        run: |
          $root = Join-Path $env:RUNNER_TEMP "mpc-full-validation"
          $source = @(Get-ChildItem (Join-Path $root "corpus") -Recurse -Filter "P01-R03-CurvedSurfaces.STEP")
          if ($source.Count -ne 1) { throw "Expected one R03 input." }
          dotnet run --project tools/ci/B18CurveProbe/B18CurveProbe.csproj -c Release -- $source[0].FullName (Join-Path $root "evidence/b18-curves.json")
          if ($LASTEXITCODE -ne 0) { throw "B18 real rational curve verification failed." }
      - name: R01 R02 R03 compatibility
        id: corpus
        run: ./tools/ci/Invoke-MpcFullValidation.ps1 -Stage Corpus
      - name: Reconcile current R03 diagnostics
        if: always() && (steps.corpus.outcome == 'success' || steps.corpus.outcome == 'failure')
        run: python tools/ci/reconcile_r03.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mpc-full-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/mpc-full-validation/evidence/
          retention-days: 30
          if-no-files-found: error
